name: Build Cham dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cham.dylib
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xcodebuild -version
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Compile versioned dylib
        id: compile
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1

          DYLIB_PATH="$(find .theos -type f -name 'Cham.dylib' -print -quit)"
          if [ -z "$DYLIB_PATH" ]; then
            echo "Cham.dylib was not produced by Theos." >&2
            exit 1
          fi

          VERSION="$(printf '%02d' "$GITHUB_RUN_NUMBER")"
          OUTPUT_NAME="Cham-${VERSION}.dylib"
          mkdir -p "${RUNNER_TEMP}/cham-output"
          cp "$DYLIB_PATH" "${RUNNER_TEMP}/cham-output/${OUTPUT_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          file "${RUNNER_TEMP}/cham-output/${OUTPUT_NAME}"
          xcrun lipo -info "${RUNNER_TEMP}/cham-output/${OUTPUT_NAME}"

      - name: Upload versioned dylib
        uses: actions/upload-artifact@v4
        with:
          name: Cham-${{ steps.compile.outputs.version }}
          path: ${{ runner.temp }}/cham-output/Cham-${{ steps.compile.outputs.version }}.dylib
          if-no-files-found: error
          retention-days: 7
