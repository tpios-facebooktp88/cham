name: Build Cham dylib

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Cham.dylib
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos and iOS SDK
        env:
          THEOS: ${{ runner.temp }}/theos
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xcodebuild -version
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Compile dylib only
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make clean all FINALPACKAGE=1

          DYLIB_PATH="$(find .theos -type f -name 'Cham.dylib' -print -quit)"
          if [ -z "$DYLIB_PATH" ]; then
            echo "Cham.dylib was not produced by Theos." >&2
            exit 1
          fi

          mkdir -p "${RUNNER_TEMP}/cham-output"
          cp "$DYLIB_PATH" "${RUNNER_TEMP}/cham-output/Cham.dylib"
          file "${RUNNER_TEMP}/cham-output/Cham.dylib"
          xcrun lipo -info "${RUNNER_TEMP}/cham-output/Cham.dylib"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Cham-dylib-${{ github.run_number }}
          path: ${{ runner.temp }}/cham-output/Cham.dylib
          if-no-files-found: error
          retention-days: 7
